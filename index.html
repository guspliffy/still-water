<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
    <meta name="theme-color" content="#02040a" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="icon" href="./icon.svg" type="image/svg+xml" />
    <title>Still Water</title>
    <style>
      :root {
        --ink: #e8dcc0;
        --dim: #8a93a8;
        --gold: #ffc23d;
        --bg: #02040a;
        --panel: rgba(10, 18, 34, 0.82);
      }
      * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
      html, body {
        margin: 0; height: 100%; overflow: hidden; background: var(--bg); color: var(--ink);
        font-family: system-ui, -apple-system, 'Segoe UI', sans-serif;
        overscroll-behavior: none; touch-action: none; user-select: none; -webkit-user-select: none;
      }
      #app { position: fixed; inset: 0; }
      #app canvas { display: block; touch-action: none; }
      .hud { position: fixed; left: 0; right: 0; display: flex; align-items: center; justify-content: space-between;
        padding: 0 max(16px, env(safe-area-inset-left)); pointer-events: none; }
      .hud > * { pointer-events: auto; }
      #top { top: 0; height: calc(56px + env(safe-area-inset-top)); padding-top: env(safe-area-inset-top); }
      #bottom { bottom: 0; height: calc(72px + env(safe-area-inset-bottom)); padding-bottom: env(safe-area-inset-bottom); justify-content: center; }
      #top > div:first-child { min-width: 0; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; margin-right: 8px; }
      #title { font-size: 15px; letter-spacing: 0.08em; color: var(--dim); text-transform: uppercase; }
      #title b { color: var(--ink); font-weight: 600; }
      #mood { margin-left: 8px; font-size: 11px; padding: 2px 8px; border-radius: 99px; border: 1px solid #2a3550; color: var(--dim); letter-spacing: 0.1em; }
      .btns { display: flex; gap: 6px; }
      button.icon { width: 36px; height: 36px; border-radius: 50%; border: 1px solid #1f2a42; background: rgba(12, 20, 38, 0.6);
        color: var(--ink); font-size: 17px; display: grid; place-items: center; cursor: pointer; padding: 0; }
      button.icon:active { transform: scale(0.94); }
      /* Controls idle at 70% so they read without competing with the pond (GDD §7). */
      button.icon, #title { opacity: 0.7; transition: opacity 0.2s; }
      button.icon:hover, button.icon:active, #title:hover, #title:active { opacity: 1; }
      #title.door { cursor: pointer; }
      #title .door-mark { margin-left: 6px; color: var(--ink); }
      #stones { display: flex; gap: 10px; align-items: center; }
      .stone { width: 16px; height: 12px; border-radius: 50%; background: #c9cfdb; box-shadow: 0 1px 0 #6d7487 inset, 0 0 8px rgba(200,210,230,0.15); transition: all 0.3s; }
      .stone.used { background: transparent; box-shadow: 0 0 0 1.5px #2b3550 inset; }
      .par { width: 1px; height: 18px; background: #3a4a66; margin: 0 2px; }
      #overlay { position: fixed; inset: 0; display: none; align-items: flex-end; justify-content: center; pointer-events: none;
        padding: 16px 16px calc(84px + env(safe-area-inset-bottom)); }
      #overlay.show { display: flex; }
      .card { pointer-events: auto; text-align: center; padding: 28px 30px 24px; border-radius: 22px; background: var(--panel);
        border: 1px solid #1d2840; backdrop-filter: blur(6px); min-width: 250px; animation: rise 0.6s cubic-bezier(.2,.9,.3,1.2); }
      @keyframes rise { from { opacity: 0; transform: translateY(14px) scale(0.97); } to { opacity: 1; transform: none; } }
      .card h2 { margin: 0 0 6px; font-weight: 300; font-size: 34px; letter-spacing: 0.06em; }
      .card p { margin: 4px 0 16px; color: var(--dim); font-size: 14px; }
      .stars { font-size: 30px; letter-spacing: 6px; margin: 4px 0 4px; color: #2b3550; }
      .stars .on { color: var(--gold); text-shadow: 0 0 14px rgba(255, 194, 61, 0.5); }
      .row { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; }
      .card button { font: inherit; font-size: 15px; padding: 11px 20px; border-radius: 99px; cursor: pointer; border: 1px solid #2a3550; background: transparent; color: var(--ink); }
      .card button.primary { background: #e8dcc0; color: #0a1220; border-color: #e8dcc0; font-weight: 600; }
      #coach { position: fixed; left: 0; right: 0; top: calc(52px + env(safe-area-inset-top)); height: 52px; display: flex; align-items: center;
        justify-content: center; padding: 0 16px; pointer-events: none; }
      #coach span { max-width: 560px; text-align: center; font-size: 16px; line-height: 1.3; color: var(--ink); opacity: 0; transform: translateY(-4px);
        transition: opacity 0.45s, transform 0.45s; text-shadow: 0 1px 8px #000; }
      #coach span.show { opacity: 1; transform: none; }
      #bottom { flex-direction: column; gap: 6px; }
      #bar { display: flex; align-items: center; gap: 18px; }
      #stones-box { display: flex; flex-direction: column; align-items: center; gap: 6px; }
      #btn-restart { font: inherit; font-size: 15px; font-weight: 600; letter-spacing: 0.03em; padding: 10px 18px 10px 14px; border-radius: 99px;
        border: 1px solid #4a5a7c; background: #111c33; color: var(--ink); cursor: pointer; display: flex; align-items: center; gap: 6px;
        box-shadow: 0 2px 14px rgba(0, 0, 0, 0.35); transition: background 0.3s, color 0.3s, border-color 0.3s, opacity 0.3s; backdrop-filter: blur(4px); }
      #btn-restart span { font-size: 18px; line-height: 1; }
      #btn-restart:active { transform: scale(0.95); }
      #btn-restart.idle { color: var(--dim); }
      #btn-restart.nudge { background: #e8dcc0; color: #0a1220; border-color: #e8dcc0; opacity: 1; animation: nudge 1.8s ease-in-out infinite; }
      @keyframes nudge { 0%, 100% { box-shadow: 0 0 0 0 rgba(232, 220, 192, 0.45); } 50% { box-shadow: 0 0 0 9px rgba(232, 220, 192, 0); } }
      #stones-caption { font-size: 11px; letter-spacing: 0.12em; text-transform: uppercase; color: var(--dim); }
      .card .icon-row { display: flex; justify-content: center; margin-bottom: 8px; }
      .card.wide { max-width: 360px; text-align: left; }
      .card.wide h2 { text-align: center; font-size: 26px; }
      .legend { display: grid; grid-template-columns: 44px 1fr; gap: 10px 12px; align-items: center; margin: 14px 0 18px; font-size: 14px; color: var(--ink); }
      .legend small { color: var(--dim); display: block; font-size: 12.5px; }
      .card .lead { color: var(--ink); font-size: 16px; line-height: 1.45; }
      #overlay.center { align-items: center; padding-bottom: 16px; }
      @media (max-width: 420px) { #title { font-size: 12.5px; letter-spacing: 0.05em; } }
      #title { cursor: pointer; }
      .card .gold { color: var(--gold); }
      .card.map { width: min(360px, 100%); padding: 22px 20px 20px; }
      .card.map h2 { font-size: 26px; }
      .card.map p { margin-bottom: 8px; }
      .map-scroll { height: min(52vh, 440px); overflow-y: auto; overflow-x: hidden; margin: 6px -8px 14px; padding: 20px 8px; scrollbar-width: none; touch-action: pan-y;
        mask-image: linear-gradient(transparent, #000 24px, #000 calc(100% - 24px), transparent); }
      .map-scroll::-webkit-scrollbar { display: none; }
      .map-wrap { position: relative; width: calc(min(52vh, 440px) * 0.6); margin: 0 auto; }
      .map-wrap svg { position: absolute; inset: 0; width: 100%; height: 100%; overflow: visible; }
      .trail { fill: none; stroke: #2a3550; stroke-width: 3; stroke-dasharray: 2 7; stroke-linecap: round; }
      .trail.lit { stroke: #e8c37a; stroke-dasharray: none; opacity: 0.75; }
      .stop { position: absolute; width: 38px; height: 38px; margin: -19px 0 0 -19px; border-radius: 50%; display: grid; place-items: center;
        font: inherit; font-size: 15px; font-weight: 600; padding: 0; border: 1.5px solid #2a3550; background: #0b1424; color: #4a5672; }
      .stop.open { cursor: pointer; border-color: #8a93a8; color: var(--ink); background: #131f38; }
      .stop.done { background: #e8dcc0; color: #0a1220; border-color: #e8dcc0; }
      .stop.current { border-color: var(--gold); color: var(--gold); background: #1a2440; animation: here 2s ease-in-out infinite; }
      @keyframes here { 0%, 100% { box-shadow: 0 0 0 0 rgba(255, 194, 61, 0.5); } 50% { box-shadow: 0 0 0 10px rgba(255, 194, 61, 0); } }
      .stop i { position: absolute; top: 37px; left: 50%; transform: translateX(-50%); font-style: normal; font-size: 10px; letter-spacing: 1px; white-space: nowrap; }
      .stop i b { color: #3a4560; font-weight: 400; }
      .stop i b.on { color: var(--gold); }
      .settings { display: flex; flex-direction: column; gap: 14px; margin: 16px 0 20px; text-align: left; }
      .set-row { display: flex; align-items: center; justify-content: space-between; gap: 16px; font-size: 16px; }
      .set-row small { display: block; color: var(--dim); font-size: 12.5px; margin-top: 2px; }
      .card button.toggle { min-width: 64px; padding: 8px 14px; font-weight: 600; color: var(--dim); }
      .card button.toggle.on { background: #e8dcc0; color: #0a1220; border-color: #e8dcc0; }
      .card button.quiet { border: none; color: var(--dim); font-size: 12.5px; margin-top: 10px; padding: 6px; }
      .quiet-row { display: flex; flex-wrap: wrap; justify-content: center; gap: 4px 10px; margin-top: 6px; }
      .quiet-row button.quiet { margin-top: 0; }
      .tp-dfwv { z-index: 20 !important; max-height: 80vh; overflow: auto; }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <div id="top" class="hud">
      <div><span id="title"></span><span id="mood"></span></div>
      <div class="btns">
        <button class="icon" id="btn-settings" title="Settings" aria-label="Settings">⚙</button>
      </div>
    </div>
    <div id="coach"><span id="coach-text"></span></div>
    <div id="bottom" class="hud">
      <div id="bar">
        <div id="stones-box"><div id="stones"></div><div id="stones-caption"></div></div>
        <button id="btn-restart" title="Retry this pond (R)" aria-label="Retry this pond"><span>↺</span> Retry</button>
      </div>
    </div>
    <div id="overlay"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
